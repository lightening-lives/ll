name: Deploy to GitHub Pages

on:
  push:
    branches: [chores/3d-design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html favicon.ico favicon-16.png favicon-32.png apple-touch-icon.png \
             icon-192.png icon-512.png icon-512-maskable.png site.webmanifest \
             robots.txt sitemap.xml _site/
          cp -r assets dist src vendor preview _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
